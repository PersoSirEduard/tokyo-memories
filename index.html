<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f1428">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tokyo Memories</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="apple-touch-icon" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="touch"></div>

  <div id="hud" class="hidden">
    <div id="station-card">
      <div class="badge"><span></span></div>
      <div class="names"><div class="jp"></div><div class="en"></div></div>
    </div>
    <button id="album-btn" aria-label="Album"><span class="stack"></span><span class="count">0/6</span></button>
    <div id="objective"></div>
  </div>

  <div id="joystick"><div class="knob"></div></div>
  <button id="shutter-btn" class="hidden" aria-label="Take photo">
    <svg viewBox="0 0 48 48"><rect x="6" y="14" width="36" height="26" rx="6"/><rect x="17" y="8" width="14" height="8" rx="2"/><circle cx="24" cy="27" r="8" class="lens"/><circle cx="24" cy="27" r="4"/></svg>
  </button>
  <button id="mute-btn" class="hidden" aria-label="Sound">♪</button>

  <div id="bubbles"></div>
  <div id="guide-arrow" class="hidden"><span>🐕</span></div>

  <div id="nameboard" class="hidden">
    <div class="board">
      <div class="jp"></div>
      <div class="en"></div>
      <div class="bar"><span class="prev"></span><span class="code"></span><span class="next"></span></div>
    </div>
  </div>

  <div id="photo-layer" class="hidden">
    <div id="viewfinder"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><div class="focus"></div></div>
    <div id="flash"></div>
    <div id="print-stage">
      <div id="eject">
        <div id="polaroid">
          <div class="photo"><img alt=""></div>
          <div class="caption"></div>
          <div class="meta"></div>
        </div>
      </div>
      <div id="instax">
        <div class="slot"></div>
        <div class="vf"></div>
        <div class="flashwin"></div>
        <div class="lens"><div></div></div>
        <div class="btn"></div>
        <div class="brand">memories</div>
      </div>
    </div>
    <button id="keep-btn" class="hidden">keep ♡</button>
  </div>

  <div id="train-panel" class="hidden">
    <div class="led"><span class="a"></span></div>
  </div>
  <button id="skip-btn" class="hidden">skip ›</button>

  <div id="album" class="hidden"><div class="grid"></div><p>tap to close</p></div>

  <div id="intro">
    <div class="lantern">
      <div class="paper"></div>
      <div class="glow"></div>
      <div class="ribs"></div>
      <!-- Shadow puppets cast onto the paper from behind -->
      <svg class="shadows" viewBox="0 0 300 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="soft-blur" stdDeviation="1.4"/></filter></defs>
        <g class="cast" filter="url(#soft)">
          <g id="p-title">
            <text id="t-jp" x="150" y="150" text-anchor="middle" class="jp"></text>
            <text id="t-en" x="150" y="196" text-anchor="middle" class="en"></text>
          </g>
          <g id="p-couple" transform="translate(28 232) scale(1.22)">
            <line x1="72" y1="100" x2="72" y2="420"/>
            <line x1="132" y1="70" x2="132" y2="420"/>
            <g transform="rotate(7 72 56)"><circle cx="72" cy="40" r="13"/><path d="M58 40 C57 21 87 21 86 40 L89 88 C80 92 64 92 55 88 Z"/></g>
            <path d="M64 54 Q72 51 80 54 Q86 56 85 62 L85 86 L59 86 L59 62 Q58 56 64 54 Z"/>
            <path d="M59 84 L85 84 L93 125 L51 125 Z"/>
            <path d="M62 123 L69 123 L68 151 L62 151 Z M75 123 L82 123 L82 151 L76 151 Z"/>
            <path d="M60 149 L69 149 L69 154 L58 154 Z M75 149 L84 149 L86 154 L75 154 Z"/>
            <path d="M61 58 L55 59 L50 98 L56 99 Z M83 58 L89 58 L104 96 L98 100 Z"/>
            <g transform="rotate(-6 132 44)"><circle cx="132" cy="27" r="14"/><circle cx="121" cy="21" r="6.5"/><circle cx="127" cy="14" r="7"/><circle cx="136" cy="13" r="7"/><circle cx="143" cy="20" r="6.5"/><circle cx="131" cy="17" r="7"/></g>
            <path d="M127 38 L137 38 L137 47 L127 47 Z"/>
            <path d="M118 43 Q132 39 146 43 Q153 45 152 54 L148 97 L116 97 L112 54 Q111 45 118 43 Z"/>
            <path d="M117 95 L131 95 L129 153 L119 153 Z M133 95 L147 95 L144 153 L135 153 Z"/>
            <path d="M117 150 L129 150 L130 156 L114 156 Z M135 150 L145 150 L148 156 L134 156 Z"/>
            <path d="M114 49 L108 50 L99 98 L105 100 Z M150 49 L156 50 L160 97 L154 98 Z"/>
            <circle cx="101.5" cy="98.5" r="5.5"/>
            <g id="p-heart">
              <path d="M101 77 Q103 88 101.5 93" fill="none" class="wire"/>
              <path d="M101 66 C97 60 89 63 93 70 L101 77 L109 70 C113 63 105 60 101 66 Z" class="tint"/>
            </g>
          </g>
          <g id="p-shiba" transform="translate(150 470)">
            <line x1="0" y1="0" x2="0" y2="400"/>
            <g id="shiba-body">
              <g class="leg" id="leg-bf"><path d="M-17 2 h6 v16 h-6 Z"/></g>
              <g class="leg" id="leg-ff"><path d="M11 2 h6 v16 h-6 Z"/></g>
              <path d="M-22 -4 Q-24 -16 -10 -16 L14 -16 Q22 -16 22 -6 L22 4 Q22 8 16 8 L-18 8 Q-24 8 -22 -4 Z"/>
              <g id="shiba-head">
                <circle cx="24" cy="-20" r="9"/>
                <path d="M28 -24 L39 -20 L38 -14 L28 -13 Z"/>
                <path d="M16 -26 L18 -37 L24 -28 Z M23 -28 L28 -37 L30 -25 Z"/>
              </g>
              <g id="shiba-tail"><path d="M-19 -13 C-33 -18 -31 -35 -21 -31 C-15 -29 -16 -22 -21 -19 Z"/></g>
              <g class="leg" id="leg-bb"><path d="M-12 2 h6 v16 h-6 Z"/></g>
              <g class="leg" id="leg-fb"><path d="M15 2 h6 v16 h-6 Z"/></g>
            </g>
          </g>
        </g>
      </svg>
      <div class="cap top"></div>
      <div class="cap bottom"></div>
    </div>
    <button id="start-btn">はじめる · Start</button>
    <div class="loading">folding paper…</div>
  </div>

  <div id="ending" class="hidden">
    <div class="wall"></div>
    <div class="msg">
      <div class="jp"></div>
      <div class="en"></div>
      <p class="note"></p>
      <button id="replay-btn">play again</button>
    </div>
  </div>

  <div id="fade"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
